<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistema de Evaluación</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <h1 class="error-title">Error del Sistema</h1>
        </div>
        <p class="error-message">
            {{ mensaje or 'La página que buscas no existe o no está disponible.' }}
        </p>
        <a href="{{ url_for('main.admin_login') }}" class="back-btn">🏠 Ir al Inicio</a>
        <div class="error-footer">
            ¿Necesitas ayuda? <a href="mailto:{{ admin_email }}">Contacta al administrador</a>
        </div>
    </div>
</body>
</html>

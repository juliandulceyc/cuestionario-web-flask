<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Candidatos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/panel-admin.css') }}">
</head>

<body>
    <div class="container">
        <section class="panel-temas">
            <h2>🗂 Gestión de Temas de Evaluación</h2>
            <form id="form-subir-tema" enctype="multipart/form-data" method="post" action="{{ url_for('main.subir_tema') }}" class="form-subir-tema">
                <label for="archivo_tema"><span class="bold-label">Subir nuevo archivo Excel de preguntas:</span></label>
                <input type="file" id="archivo_tema" name="archivo_tema" accept=".xlsx,.xls" required>
                <button type="submit" class="btn btn-primary">Subir archivo</button>
            </form>
            <form id="form-seleccionar-tema" method="post" action="{{ url_for('main.seleccionar_tema') }}">
                <label for="archivo_excel"><span class="bold-label">Seleccionar tema activo:</span></label>
                <select id="archivo_excel" name="archivo_excel" class="select-archivo-excel"></select>
                <button type="submit" class="btn btn-success">Activar tema</button>
            </form>
            <div id="tema-resultado" class="tema-resultado"></div>
        </section>
        <div class="header">
            <h1>📋 Gestión de Candidatos</h1>
            <div class="config-info">
                👥 Consulta y estado de candidatos
            </div>
            <div class="dashboard-actions">
                <div class="dashboard-actions-container">
                    <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-primary">📊 Dashboard</a>
                    <a href="{{ url_for('main.admin_logout') }}" class="btn btn-danger btn-logout">Cerrar
                        Sesión</a>
                </div>
            </div>
        </div>
        <section aria-labelledby="candidates-title">
            <h2 id="candidates-title">Candidatos Registrados</h2>
            <div class="panel-filtros">
                <input type="text" id="busqueda-candidato" placeholder="Buscar por nombre, email o código" class="input-busqueda">
                <select id="filtro-estado" class="select-filtro">
                    <option value="">Todos</option>
                    <option value="completada">Completada</option>
                    <option value="pendiente">Pendiente</option>
                </select>
                <select id="filtro-cargo" class="select-filtro">
                    <option value="">Todos los cargos</option>
                    {% for cargo in cargos_unicos %}
                    <option value="{{ cargo }}">{{ cargo }}</option>
                    {% endfor %}
                </select>
            </div>
            <div id="candidatos-lista">
                <!-- Renderizado dinámico por JS -->
            </div>
            <div id="paginacion-candidatos" class="paginacion-candidatos"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/admin-panel.js') }}"></script>
</body>

</html>

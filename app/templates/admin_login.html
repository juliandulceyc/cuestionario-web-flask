<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gestión de Candidatos</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#137fec",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
            "text-light": "#333333",
            "text-dark": "#f1f3f5",
            "placeholder-light": "#888888",
            "placeholder-dark": "#76899a",
            "border-light": "#cfdbe7",
            "border-dark": "#344558",
            "card-light": "#ffffff",
            "card-dark": "#182635"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
  <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 group/design-root"
    style='font-family: Inter, "Noto Sans", sans-serif;'>
    <div class="w-full max-w-md space-y-8">
      <div class="flex flex-col items-center">
        <div class="flex items-center justify-center rounded-xl bg-primary/20 dark:bg-primary/30 h-16 w-16 mb-6">
          <span class="material-symbols-outlined text-primary text-4xl">
            assessment
          </span>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-center text-text-light dark:text-text-dark">Login
        </h1>
      </div>
      <div
        class="rounded-xl border border-border-light dark:border-border-dark bg-card-light dark:bg-card-dark p-8 shadow-sm">

        <!-- Error Message Block -->
        {% if error %}
        <div class="mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
          <span class="font-medium">Error:</span> {{ error }}
        </div>
        {% endif %}

        <form class="space-y-6" action="{{ url_for('main.admin_authenticate') }}" method="POST">
          <div>
            <label class="block text-sm font-medium pb-2 text-text-light dark:text-text-dark"
              for="username">Usuario</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                <span class="material-symbols-outlined text-placeholder-light dark:text-placeholder-dark">
                  person
                </span>
              </div>
              <input autocomplete="username"
                class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark focus:border-primary focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal"
                id="username" name="username" placeholder="Ingresa tu usuario" required="" type="text" value="" />
            </div>
            <span id="username-error" class="text-red-500 text-xs mt-1 block"></span>
          </div>
          <div>
            <label class="block text-sm font-medium pb-2 text-text-light dark:text-text-dark"
              for="password">Contraseña</label>
            <div class="relative">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                <span class="material-symbols-outlined text-placeholder-light dark:text-placeholder-dark">
                  lock
                </span>
              </div>
              <input autocomplete="current-password"
                class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder:text-placeholder-light dark:placeholder:text-placeholder-dark focus:border-primary focus:ring-primary h-14 p-[15px] pl-12 pr-12 text-base font-normal"
                id="password" name="password" placeholder="Contraseña" required="" type="password" />
              <button aria-label="Show password" class="absolute inset-y-0 right-0 flex items-center pr-3.5"
                type="button" onclick="togglePassword()">
                <span id="eye-icon"
                  class="material-symbols-outlined text-placeholder-light dark:text-placeholder-dark cursor-pointer">
                  visibility
                </span>
              </button>
            </div>
            <span id="password-error" class="text-red-500 text-xs mt-1 block"></span>
          </div>
          <div class="pt-2">
            <button
              class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors"
              type="submit">
              <span class="truncate btn-text">Iniciar Sesión</span>
              <span class="btn-loader hidden ml-2 animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
            </button>
          </div>
          <div class="text-center">
            <a class="text-sm font-normal text-primary hover:underline"
              href="{{ url_for('main.recuperar_password') }}">¿Olvidaste tu contraseña?</a>
          </div>
        </form>
      </div>
      <p class="text-center text-xs text-placeholder-light dark:text-placeholder-dark">© 2025 CandidateApp. Todos los
        derechos reservados.</p>
    </div>
  </div>
  <output id="login-status" class="sr-only" aria-live="polite"></output>
  <script src="{{ url_for('static', filename='js/admin-login.js') }}"></script>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }
  </script>
</body>

</html>

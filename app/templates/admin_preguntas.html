<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50 dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Preguntas - {{ tema.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans antialiased text-gray-900 dark:text-gray-100">
    <div class="min-h-full">
        <nav class="bg-white dark:bg-gray-800 shadow-sm">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 justify-between items-center">
                    <div class="flex items-center">
                        <a href="{{ url_for('main.admin_temas') }}" class="flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white mr-4">
                            <span class="material-symbols-outlined">arrow_back</span>
                        </a>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white">Preguntas: {{ tema.nombre }}</h1>
                    </div>
                </div>
            </div>
        </nav>

        <main class="py-10">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <!-- Crear Nueva Pregunta -->
                <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 mb-8">
                    <h2 class="text-lg font-medium mb-4">Agregar Pregunta</h2>
                    <form action="{{ url_for('main.crear_pregunta', tema_id=tema.id) }}" method="POST" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Texto de la Pregunta</label>
                            <textarea name="texto" required rows="2" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Opción A</label>
                                <input type="text" name="opcion_a" required class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Opción B</label>
                                <input type="text" name="opcion_b" required class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Opción C</label>
                                <input type="text" name="opcion_c" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Opción D</label>
                                <input type="text" name="opcion_d" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <div class="w-1/4">
                                <label class="block text-sm font-medium mb-1">Respuesta Correcta</label>
                                <select name="respuesta_correcta" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                </select>
                            </div>
                            <div class="w-1/4">
                                <label class="block text-sm font-medium mb-1">Nivel</label>
                                <input type="number" name="nivel" value="1" min="1" max="5" class="w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm p-2 border">
                            </div>
                        </div>
                        <button type="submit" class="bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700">Guardar Pregunta</button>
                    </form>
                </div>

                <!-- Lista de Preguntas -->
                <div class="space-y-4">
                    {% for pregunta in preguntas %}
                    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-4">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 mr-2">Nivel {{ pregunta.nivel }}</span>
                                <h3 class="text-lg font-medium text-gray-900 dark:text-white mt-1">{{ pregunta.texto }}</h3>
                                <ul class="mt-2 space-y-1 text-sm text-gray-500 dark:text-gray-400">
                                    {% for opcion in pregunta.opciones %}
                                    <li class="{% if loop.index0 == 0 and pregunta.respuesta_correcta == 'A' %}text-green-600 font-bold{% elif loop.index0 == 1 and pregunta.respuesta_correcta == 'B' %}text-green-600 font-bold{% elif loop.index0 == 2 and pregunta.respuesta_correcta == 'C' %}text-green-600 font-bold{% elif loop.index0 == 3 and pregunta.respuesta_correcta == 'D' %}text-green-600 font-bold{% endif %}">
                                        {{ opcion }}
                                    </li>
                                    {% endfor %}
                                </ul>
                            </div>
                            <form action="{{ url_for('main.eliminar_pregunta', pregunta_id=pregunta.id) }}" method="POST" onsubmit="return confirm('¿Estás seguro?');">
                                <button type="submit" class="text-red-600 hover:text-red-900">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <div class="container">
        <section class="panel-temas" style="margin-bottom:30px;">
            <h2>🗂 Gestión de Temas de Evaluación</h2>
            <form id="form-subir-tema" enctype="multipart/form-data" method="post" style="margin-bottom:15px;">
                <label for="archivo_tema"><b>Subir nuevo archivo Excel de preguntas:</b></label>
                <input type="file" id="archivo_tema" name="archivo_tema" accept=".xlsx,.xls" required>
                <button type="submit" class="btn btn-primary">Subir archivo</button>
            </form>
            <form id="form-seleccionar-tema" method="post">
                <label for="archivo_excel"><b>Seleccionar tema activo:</b></label>
                <select id="archivo_excel" name="archivo_excel" style="min-width:200px;"></select>
                <button type="submit" class="btn btn-success">Activar tema</button>
            </form>
            <div id="tema-resultado" style="margin-top:10px;color:#155724;"></div>
        </section>
        <div class="header">
            <h1>📊 Panel de Administración</h1>
            <div class="config-info">
                👥 Gestión de candidatos y registro
            </div>
            <div class="dashboard-actions">
                <a href="/admin/logout" class="btn btn-danger">Cerrar Sesión</a>
            </div>
        </div>
        <section class="form-section" id="formularioRegistro" style="display: none;">
                        <h2 style="margin-bottom: 1.5rem;">Registrar Nuevo Candidato</h2>
                        <form id="candidatoForm">
                            <div class="form-registro-candidato">
                                <div class="form-row">
                                    <label for="tipo_documento" class="form-label">Tipo de documento:</label>
                                    <select id="tipo_documento" name="tipo_documento" required class="form-input">
                                            <option value="CC">Cédula de ciudadanía</option>
                                            <option value="TI">Tarjeta de identidad</option>
                                            <option value="CE">Cédula de extranjería</option>
                                            <option value="PA">Pasaporte</option>
                                            <option value="RC">Registro civil</option>
                                            <option value="NIT">NIT</option>
                                            <option value="Otro">Otro</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <label for="numero_documento" class="form-label">Número de Documento:</label>
                                    <input type="text" id="numero_documento" name="numero_documento" placeholder="Número de Documento" required class="form-input">
                                </div>
                                <div class="form-row">
                                    <label for="nombre_completo" class="form-label">Nombre Completo:</label>
                                    <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Nombre Completo" required class="form-input">
                                </div>
                                <div class="form-row">
                                    <label for="email" class="form-label">Email:</label>
                                    <input type="email" id="email" name="email" placeholder="Email" required class="form-input">
                                </div>
                                <div class="form-row">
                                    <label for="cargo" class="form-label">Cargo:</label>
                                    <input type="text" id="cargo" name="cargo" placeholder="Cargo" required class="form-input">
                                </div>
                            </div>
                            <div class="form-actions" style="display: flex; justify-content: center; gap: 24px; margin-top: 2rem;">
                                <button type="submit" class="btn btn-primary" style="min-width: 160px;">💾 Registrar</button>
                                <button type="button" class="btn btn-secondary cancel" data-action="cancel" style="min-width: 160px;">❌ Cancelar</button>
                            </div>
                        </form>
        </section>
        <section>
            <button type="button" class="add-candidate-btn btn btn-success" data-action="show-form" style="margin-bottom: 20px;">
                ➕ Registrar Candidato
            </button>
            <h2>📋 Candidatos Registrados</h2>
            <div id="listaCandidatos" class="candidatos-list">
                <div class="loading">Cargando...</div>
            </div>
        </section>
    </div>
    <script src="{{ url_for('static', filename='js/admin-dashboard.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/admin-panel.js') }}" defer></script>
</body>
</html>

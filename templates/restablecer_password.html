<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Restablecer Contraseña - Admin</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/admin-login.css') }}">
	<style>
		.mensaje-error { background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
	</style>
	</head>
<body>
	<div class="container">
		<div class="header">
			<h1>Restablecer Contraseña</h1>
			<p style="color: #666; margin-top: 10px;">Ingresa tu nueva contraseña</p>
		</div>

		{% if error %}
		<div class="mensaje-error">{{ error }}</div>
		{% endif %}

		<form method="POST" action="/admin/restablecer-password">
			<input type="hidden" name="token" value="{{ token }}">

			<div class="login-form-group">
				<label for="nueva_password">Nueva Contraseña:</label>
				<input type="password" id="nueva_password" name="nueva_password" required placeholder="Mínimo 6 caracteres" minlength="6">
			</div>

			<div class="login-form-group">
				<label for="confirmar_password">Confirmar Contraseña:</label>
				<input type="password" id="confirmar_password" name="confirmar_password" required placeholder="Repite la contraseña" minlength="6">
			</div>

			<div style="display: flex; gap: 10px; justify-content: center;">
				<button type="submit" class="btn-login">Cambiar Contraseña</button>
				<a href="/admin/login" class="btn-login" style="background: #6c757d; text-decoration: none; display: inline-block; text-align: center;">Cancelar</a>
			</div>
		</form>

		<a href="/admin/login" class="back-link">« Volver al inicio de sesión</a>
	</div>

	<script>
		const form = document.querySelector('form[action="/admin/restablecer-password"]');
		if (form) {
			form.addEventListener('submit', function (e) {
				const nueva = document.getElementById('nueva_password').value;
				const confirmar = document.getElementById('confirmar_password').value;
				if (nueva !== confirmar) {
					e.preventDefault();
					alert('Las contraseñas no coinciden');
					return false;
				}
				if (nueva.length < 6) {
					e.preventDefault();
					alert('La contraseña debe tener al menos 6 caracteres');
					return false;
				}
			});
		}
	</script>
</body>
</html>

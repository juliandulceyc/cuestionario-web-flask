<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .login-form-group { margin-bottom: 18px; }
        .login-form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #495057; }
        .login-form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .btn-login { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; width: 100%; }
        .btn-login:hover { background: #0056b3; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Panel de Administración</h1>
            <div class="config-info" style="background: #d1ecf1; color: #0c5460; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #b8daff; font-size: 14px;">
                🔐 Acceso restringido para administradores
            </div>
        </div>
        <form action="/admin/authenticate" method="POST">
            <div class="login-form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" value="admin" required>
                <span id="username-error" class="error-message"></span>
            </div>
            <div class="login-form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                <span id="password-error" class="error-message"></span>
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div id="login-status" class="sr-only"></div>
    </div>
    <script src="{{ url_for('static', filename='js/admin-login.js') }}" defer></script>
</body>
</html>

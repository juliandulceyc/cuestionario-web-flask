<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <div class="container login-container" style="max-width: 380px; margin: 40px auto; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.10); background: #fff;">
        <div class="header">
            <h1>Panel de Administración</h1>
            <div class="config-info badge-info" style="display: flex; align-items: center; gap: 8px;">
                Acceso restringido para administradores
            </div>
        </div>
        <form action="/admin/authenticate" method="POST" class="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" value="admin" required class="form-input">
                <span id="username-error" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required class="form-input">
                <span id="password-error" class="error-message"></span>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <a href="/admin/recuperar-password" style="color: #007bff; text-decoration: none; font-size: 14px;">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
        </form>
        {% if error %}
        <div class="error-message" style="margin-top: 12px;">{{ error }}</div>
        {% endif %}
        <div id="login-status" class="sr-only"></div>
    </div>
    <script src="{{ url_for('static', filename='js/admin-login.js') }}" defer></script>
</body>
</html>

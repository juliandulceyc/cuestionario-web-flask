<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-login.css') }}">
    <style>
        .mensaje-error { background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Configuración inicial</h1>
            <p style="color: #666; margin-top: 10px;">Crea el primer usuario administrador</p>
        </div>

        {% if error %}
        <div class="mensaje-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/first-run">
            <div class="login-form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Usuario admin">
            </div>
            <div class="login-form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="admin@empresa.com">
            </div>
            <div class="login-form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="login-form-group">
                <label for="confirm">Confirmar contraseña</label>
                <input type="password" id="confirm" name="confirm" required minlength="6">
            </div>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button type="submit" class="btn-login">Crear usuario</button>
                <a href="/admin/login" class="btn-login" style="background: #6c757d; text-decoration: none; display: inline-block; text-align: center;">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>

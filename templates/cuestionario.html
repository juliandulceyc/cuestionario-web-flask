<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación - {{ candidato.nombre_completo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cuestionario.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .config-info { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #c3e6cb; font-size: 14px; }
        .info { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .candidate-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { font-weight: bold; color: #495057; }
        .input-group input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        .pregunta { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .opcion { display: block; margin: 10px 0; padding: 15px; background: #e9ecef; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .opcion:hover { background: #dee2e6; border-color: #007bff; }
        .opcion.seleccionada { background-color: #007bff !important; color: white !important; border-color: #0056b3 !important; }
        button { background: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #218838; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #mensaje { margin-top: 20px; padding: 15px; border-radius: 8px; }
        .progreso { background: #e9ecef; height: 10px; border-radius: 5px; margin-bottom: 20px; }
        .progreso-barra { background: #007bff; height: 100%; border-radius: 5px; transition: width 0.3s; }
        .progreso-texto { text-align: center; margin-bottom: 10px; font-weight: bold; color: #495057; }
        .nivel-badge { display: inline-block; background: #6f42c1; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-left: 5px; }
        .action-buttons { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Prueba Técnica</h1>
            <div id="config-display" class="config-info" style="display: none;">
                📊 Evaluación de <span class="total-preguntas">40</span> preguntas | 
                🎯 Sistema adaptativo | 
                ⏱️ Sin límite de tiempo
            </div>
        </header>
        
        <section class="info" id="info-candidato">
            <strong>👤 Candidato:</strong> {{ candidato.nombre_completo }}<br>
            <strong>📧 Email:</strong> {{ candidato.email }}<br>
            <strong>🔑 Código:</strong> {{ candidato.codigo }}
        </section>
        
        <section id="formulario-confirmacion">
            <form id="candidate-form">
                <div class="form-datos" style="background:transparent;padding:0;margin:0;">
                    <div style="font-weight:bold;margin-bottom:10px;">Confirma tus datos antes de iniciar</div>
                    <div class="candidate-form-grid">
                        <div class="input-group">
                            <label for="nombre_completo">Nombre completo</label>
                            <input type="text" id="nombre_completo" value="{{ candidato.nombre_completo }}" required>
                            <span id="nombre-completo-error" class="error-message"></span>
                        </div>
                        <input type="hidden" id="documento" value="{{ candidato.codigo }}">
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" value="{{ candidato.email }}" required>
                            <span id="email-error" class="error-message"></span>
                        </div>
                        <div class="input-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" value="{{ candidato.telefono or '' }}">
                            <span id="telefono-error" class="error-message"></span>
                        </div>
                    </div>
                    <button type="submit" class="start-btn btn btn-success" style="width:100%;margin-top:15px;">
                        🚀 Confirmar Datos e Iniciar Evaluación
                    </button>
                </div>
            </form>
        </section>
        
        <section id="progreso-container" style="display: none;">
            <div class="progreso-texto" id="progreso-texto">Pregunta 1 de 40</div>
            <div class="progreso">
                <div class="progreso-barra" id="barraProgreso" style="width: 0%"></div>
            </div>
        </section>
        
        <section id="pregunta-container" style="display: none;">
            <article class="pregunta">
                <div id="pregunta-texto"></div>
                <div id="badge-multiple" style="display:none;margin:10px 0 0 0;"></div>
            </article>
            <div id="opciones-container"></div>
            <div class="action-buttons">
                <button id="btn-responder" type="button" class="btn btn-primary" disabled>Responder</button>
            </div>
            <div id="answer-status" class="sr-only"></div>
        </section>
        
        <div id="mensaje" style="display: none;"></div>
    </main>

    <script type="application/json" id="candidate-data">
        {
            "nombre_completo": "{{ candidato.nombre_completo|e }}",
            "email": "{{ candidato.email|e }}",
            "codigo": "{{ candidato.codigo|e }}",
            "telefono": "{{ candidato.telefono|e or '' }}"
        }
    </script>
    
    <script src="{{ url_for('static', filename='js/cuestionario.js') }}" defer></script>
    <script>
    // Mostrar badge de múltiple si corresponde
    function mostrarBadgeMultiple(esMultiple, respuestasCount) {
        var badge = document.getElementById('badge-multiple');
        if (!badge) return;
        if (esMultiple && respuestasCount === 2) {
            badge.style.display = 'block';
            badge.innerHTML = '<span style="background:#fff3cd;color:#856404;padding:8px 16px;border-radius:8px;font-weight:bold;border:1px solid #ffeaa7;">🔢 Esta pregunta tiene <b>dos respuestas correctas</b>. Selecciona ambas para sumar puntos.</span>';
        } else {
            badge.style.display = 'none';
            badge.innerHTML = '';
        }
    }
    // Integrar con JS principal
    window.mostrarBadgeMultiple = mostrarBadgeMultiple;
    </script>
</body>
</html>

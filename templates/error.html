<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistema de Evaluación</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .error-icon { font-size: 48px; color: #dc3545; margin-bottom: 10px; }
        .error-title { color: #dc3545; margin-bottom: 10px; }
        .error-message { color: #495057; margin-bottom: 20px; }
        .back-btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <h1 class="error-title">Error del Sistema</h1>
        </div>
        <p class="error-message">{{ mensaje or 'Ha ocurrido un error inesperado' }}</p>
        <a href="/admin/login" class="back-btn" role="button">🏠 Volver al Inicio</a>
    </div>
</body>
</html>

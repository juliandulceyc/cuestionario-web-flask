<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistema de Evaluación</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <div class="container" style="max-width:500px;margin:40px auto;background:#fff;padding:32px 24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08);text-align:center;">
        <div class="header" style="margin-bottom:18px;">
            <div class="error-icon" aria-hidden="true" style="font-size:48px;">⚠️</div>
            <h1 class="error-title" style="color:#c82333;font-size:2rem;margin:0;">Error del Sistema</h1>
        </div>
        <p class="error-message" style="color:#333;font-size:1.1rem;margin-bottom:18px;">
            {{ mensaje or 'La página que buscas no existe o no está disponible.<br>Si el problema persiste, contacta al administrador del sistema.' }}
        </p>
        <a href="/admin/login" class="back-btn" role="button" style="display:inline-block;background:#007bff;color:#fff;padding:10px 22px;border-radius:6px;text-decoration:none;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,0.07);transition:background 0.2s;">🏠 Ir al Inicio</a>
        <div style="margin-top:18px;font-size:0.95rem;color:#666;">¿Necesitas ayuda? <a href="mailto:soporte@empresa.com" style="color:#007bff;text-decoration:underline;">Contacta al administrador</a></div>
    </div>
</body>
</html>
